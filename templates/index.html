<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostate Labeler</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav id="tab-bar">
        <div class="tab-group">
            <button class="tab-btn active" data-tab="labeling">Etiketleme</button>
            <button class="tab-btn" data-tab="view3d">3D Görünüm</button>
        </div>
        <div class="tab-status">
            <span id="status-text" class="status-text">Hazır</span>
            <span id="status-dot" class="status-dot"></span>
        </div>
    </nav>

    <main id="main-content">
        <section id="tab-labeling" class="tab-panel active">
            <div class="panel-layout">
                <div class="canvas-area">
                    <div id="sample-overlay" class="sample-overlay">
                        <div class="sample-box">
                            <div class="sample-title">Örnekler</div>
                            <div id="sample-list" class="sample-list"></div>
                        </div>
                    </div>

                    <div id="canvas-wrapper" class="canvas-wrapper hidden">
                        <canvas id="slice-canvas"></canvas>
                    </div>

                    <div id="slice-controls" class="slice-controls hidden">
                        <div class="slice-info-row">
                            <span id="slice-label" class="slice-label">Slice: 0 / 0</span>
                            <span id="format-label" class="format-label"></span>
                        </div>
                        <div class="slider-row">
                            <button id="prev-btn" class="nav-btn" title="Önceki slice">‹</button>
                            <input type="range" id="slice-slider" min="0" max="0" value="0" class="slice-slider">
                            <button id="next-btn" class="nav-btn" title="Sonraki slice">›</button>
                        </div>
                    </div>
                </div>

                <aside class="control-panel">
                    <button id="open-btn" class="ctrl-btn">Örnekler</button>

                    <div class="ctrl-group">
                        <div class="ctrl-group-title">Etiketler</div>
                        <div id="label-list" class="label-list"></div>
                    </div>

                    <div class="ctrl-group">
                        <div class="ctrl-group-title">Araçlar</div>
                        <button id="draw-btn" class="ctrl-btn tool-btn">Poligon Çiz</button>
                        <button id="undo-btn" class="ctrl-btn tool-btn">Geri Al</button>
                        <button id="delete-last-btn" class="ctrl-btn tool-btn">Son Poligonu Sil</button>
                        <button id="clear-btn" class="ctrl-btn danger-btn">Slice Etiketlerini Temizle</button>
                    </div>

                    <div class="ctrl-actions">
                        <button id="save-btn" class="ctrl-btn primary">Kaydet</button>
                        <button id="download-btn" class="ctrl-btn">JSON İndir</button>
                    </div>

                    <div class="progress-section">
                        <span id="progress-label" class="progress-label">Etiketlenen: 0 / 0 slice</span>
                        <div class="progress-bar-container">
                            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </aside>
            </div>
        </section>

        <section id="tab-view3d" class="tab-panel">
            <div class="panel-layout">
                <div class="canvas-area">
                    <div id="viewer3d-container" class="viewer3d-container">
                        <div id="viewer3d-placeholder" class="viewer3d-placeholder">
                            <p>Bir örnek seçin.</p>
                        </div>
                    </div>
                </div>

                <aside class="control-panel">
                    <div class="ctrl-group">
                        <div class="ctrl-group-title">Opaklık</div>
                        <label class="opacity-label">Hacim</label>
                        <input type="range" id="vol-opacity" min="0" max="100" value="18" class="opacity-slider">
                        <label class="opacity-label">Etiket</label>
                        <input type="range" id="lbl-opacity" min="0" max="100" value="90" class="opacity-slider">
                    </div>

                    <div class="ctrl-actions">
                        <button id="refresh-3d-btn" class="ctrl-btn primary">3D Yenile</button>
                        <button id="reset-camera-btn" class="ctrl-btn">Kamerayı Sıfırla</button>
                    </div>

                    <div class="ctrl-group">
                        <div class="ctrl-group-title">İstatistikler</div>
                        <div id="stats-content" class="stats-content">
                            <span>Toplam poligon: 0</span>
                            <span>Etiketli slice: 0</span>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/polygon_tool.js"></script>
    <script src="/static/js/slice_viewer.js"></script>
    <script type="module" src="/static/js/viewer3d.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
